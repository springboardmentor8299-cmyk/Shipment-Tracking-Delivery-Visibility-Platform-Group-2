spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/shiptrack_db
spring.datasource.username={/*username*/}
spring.datasource.password={/*password*/}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

geoapify.api.key={/*geoapify-api-key*/}

app.upload.dir=uploads
app.upload.base-url=http://localhost:8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB


google.client.id={/*google-client-id*/}

app.frontend.url=http://localhost:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={/*email-username*/}
spring.mail.password={/*email-password*/}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

twilio.account-sid={/**account-sid*/}
twilio.auth-token={/**auth-token*/}
twilio.from-number={/**from-number*/}

server.error.include-message=always
server.error.include-binding-errors=always